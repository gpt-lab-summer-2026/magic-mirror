<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Closet</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    font: 14px/1.4 system-ui, sans-serif;
    background: #17212b;
    color: #f5f5f5;
  }
  nav, #statusLine { margin: 0; padding: 5px 10px; font-size: 12px; opacity: 0.75; }
  a { color: #2ea6ff; }
  #rack {
    flex: 1; display: grid; gap: 8px; padding: 8px;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  }
  figure { margin: 0; }
  /* contain, not cover: a cutout cropped to a square is unrecognisable. */
  img {
    display: block; width: 100%; height: 150px; object-fit: contain;
    border-radius: 8px;
    background: #3c3c3c;
  }
  figcaption { padding-top: 4px; text-align: center; }
</style>
</head>
<body>
<nav><a href="/map">new photo</a></nav>
<div id="rack"></div>
<p id="statusLine"></p>

<script>
const rack = document.getElementById("rack");
const statusLine = document.getElementById("statusLine");

async function load() {
  const answer = await fetch("/closet.json");
  if (answer.status === 403) { location = "/"; return; }   // the cookie is gone: log in again
  for (const garment of await answer.json()) {
    const image = document.createElement("img");
    image.src = "/thumb?i=" + garment.i;
    const caption = document.createElement("figcaption");
    caption.textContent = garment.name;   // textContent, never innerHTML, for anything the server says
    const figure = document.createElement("figure");
    figure.append(image, caption);
    figure.addEventListener("click", () => wear(garment.i));
    rack.appendChild(figure);
  }
}

// The index the list came with, never the name under it: the server looks up a
// garment by position and so has no name off the network to turn into a path.
async function wear(i) {
  const response = await fetch("/pick?i=" + i, { method: "POST" });
  statusLine.textContent = await response.text();
}

load().catch(error => { statusLine.textContent = error.message; });
</script>
</body>
</html>
