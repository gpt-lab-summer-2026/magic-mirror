<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Place the points</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    /* dvh first, vh for the browsers that don't know it: 100vh on a phone is
       taller than the visible page, which pushes the footer buttons off it. */
    margin: 0; height: 100vh; height: 100dvh; overflow: hidden;
    display: flex; flex-direction: column;
    font: 14px/1.4 system-ui, sans-serif;
    background-color: light-dark(#ffc9ed, #17212b);
    color: light-dark(#6b1a50, #f5f5f5);
  }
  #note, #statusLine { margin: 0; padding: 5px 10px; font-size: 16px; opacity: 0.75; }
  nav { padding: 8px 8px 0; }
  nav a {
    display: block; padding: 11px; border-radius: 8px; text-align: center; text-decoration: none;
    background-color: light-dark(#f5f5f5, #24384a);
    color: light-dark(#6b1a50, #f5f5f5);
  }
  /* main and footer are display:flex, which outranks the browser's own [hidden] rule. */
  [hidden] { display: none !important; }
  main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 8px; }
  /* The checkerboard the preview photo is composited on, in CSS - the cutout is
     transparent, and a garment edge over a flat colour is impossible to judge. */
  canvas {
    display: block; touch-action: none;
    background-color: #3c3c3c;
    background-image: linear-gradient(45deg, #5a5a5a 25%, transparent 25%, transparent 75%, #5a5a5a 75%),
                      linear-gradient(45deg, #5a5a5a 25%, transparent 25%, transparent 75%, #5a5a5a 75%);
    background-size: 32px 32px;
    background-position: 0 0, 16px 16px;
  }
  footer, #categories { display: flex; gap: 8px; padding: 8px; }
  footer { padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
  #intake { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  footer button, #categories button {
    flex: 1; padding: 11px; border: 0; border-radius: 8px; font: inherit;
    background-color: light-dark(#6b1a50, #1a73e8);
    color: #ffffff;
  }
  footer button:disabled { opacity: 0.4; }
  /* Landscape: the screen is too short to hold the canvas and the buttons at
     once, so the page scrolls and the stage keeps a height to scale into. */
  @media (max-height: 520px) {
    body { height: auto; min-height: 100dvh; overflow: auto; }
    main { flex: none; height: 70vw; }
  }
</style>
</head>
<body>
  <nav>
    <h1> &#11090; Magic Mirror &#11090; </h1>
    <a href="/closet">Example garments</a>
  </nav>
  <p id="note">Place the left points on the image's right &#8594; <br> 
    and right points on the image's left &#8592;
  </p>
  <br>
  <main id="stage"><canvas id="canvas"></canvas></main>
  <section id="intake" hidden>
    <h2>Upload a new garment photo: </h2>
    <input id="photo" type="file" accept="image/*">
    <p>After uploading a photo, select a category: <br>
      (for dresses, select "shirt") </p>
    <div id="categories"></div>
  </section>
  <br>
  <p id="statusLine"></p>
  <footer id="tools">
    <button id="newPhoto">New photo</button>
    <button id="undo">Undo tap</button>
    <button id="wear">Wear garment</button>
  </footer>

  <script>
  const canvas = document.getElementById("canvas");
  const context = canvas.getContext("2d");
  const statusLine = document.getElementById("statusLine");
  const wear = document.getElementById("wear");
  const note = document.getElementById("note");
  const stage = document.getElementById("stage");
  const tools = document.getElementById("tools");
  const intake = document.getElementById("intake");
  const photo = document.getElementById("photo");

  let session = null;     // what /session sent: point names, core count, size, colours
  let image = null;       // the cutout itself
  let points = [];        // [x, y] in image pixels, in point_names order - calibrate.py's list
  let dragging = false;   // the point just placed, still under the finger
  let scale = 1;          // image pixels -> CSS pixels


  async function load() {
    const answer = await fetch("/session");
    if (answer.status === 403) { location = "/"; return; }   // the cookie is gone: log in again
    await buildCategories();
    if (!answer.ok) { showIntake(); return; }                // nothing uploaded yet
    session = await answer.json();

    image = new Image();
    await new Promise((resolve, reject) => {
      image.onload = resolve;
      image.onerror = () => reject(new Error("the cutout would not load - send the photo again"));
      image.src = "/image";
    });

    layout();
  }


  // --- intake: a photo, and what it is ---

  async function buildCategories() {
    // The list comes from the server, so the page holds no copy of it. textContent
    // and not innerHTML, for everything the server says, as a habit.
    for (const category of await (await fetch("/categories")).json()) {
      const button = document.createElement("button");
      button.textContent = category;
      button.addEventListener("click", () => upload(category));
      document.getElementById("categories").appendChild(button);
    }
  }

  function showIntake() {
    intake.hidden = false;
    note.hidden = stage.hidden = tools.hidden = true;
  }

  async function upload(category) {
    if (!photo.files.length) { statusLine.textContent = "pick a photo first"; return; }
    statusLine.textContent = "working on the " + category + "...";
    // The file's own bytes and nothing wrapped round them: http.server has no
    // multipart parser, and sent this way it needs none.
    const response = await fetch("/upload?category=" + category,
                                { method: "POST", body: photo.files[0] });
    if (response.ok) location.reload();
    else statusLine.textContent = await response.text();
  }


  // --- the two coordinate spaces ---

  function clamp(x, y) {
    // The canvas is the image scaled, so a tap on its last row rounds one pixel
    // past the edge. Whole pixels, because that is what gets saved.
    return [Math.min(Math.max(Math.round(x), 0), session.width - 1),
            Math.min(Math.max(Math.round(y), 0), session.height - 1)];
  }

  function toCanvas(point) {
    return [point[0] * scale, point[1] * scale];
  }

  function colorOf(i) {
    return session.colors[i % session.colors.length];
  }


  // --- drawing ---

  function layout() {
    const ratio = window.devicePixelRatio || 1;
    const stage = canvas.parentElement;
    scale = Math.min(stage.clientWidth / session.width, stage.clientHeight / session.height);
    canvas.style.width = session.width * scale + "px";
    canvas.style.height = session.height * scale + "px";
    canvas.width = Math.round(session.width * scale * ratio);
    canvas.height = Math.round(session.height * scale * ratio);
    context.setTransform(ratio, 0, 0, ratio, 0, 0);   // so everything below is drawn in CSS pixels
    refresh();
  }

  function refresh() {
    const next = session.point_names[points.length];
    statusLine.textContent = next
      ? "tap: " + next + (points.length < session.core ? "" : " (optional)")
      : "all points set";
    wear.disabled = points.length < session.core;
    draw();
  }

  function draw() {
    const width = session.width * scale, height = session.height * scale;
    context.clearRect(0, 0, width, height);
    context.drawImage(image, 0, 0, width, height);
    context.font = "16px system-ui, sans-serif";
    points.forEach((point, i) => {
      const [x, y] = toCanvas(point);
      const name = session.point_names[i];
      context.fillStyle = colorOf(i);
      context.strokeStyle = "#000000";
      context.beginPath();
      context.arc(x, y, 7, 0, 2 * Math.PI);
      context.fill();
      context.lineWidth = 2;
      context.stroke();
      // A label that would run off the canvas goes to the dot's left and a line
      // lower instead, clear of whatever label its neighbour is already wearing.
      // Every bottom keeps its wearer's-left points against the right edge, so
      // this is the common case, not the corner one.
      const label = context.measureText(name).width;
      const fits = x + 11 + label < width;
      const labelX = fits ? x + 11 : x - 11 - label;
      const labelY = fits ? y - 9 : y + 17;
      context.lineWidth = 3;
      context.strokeText(name, labelX, labelY);
      context.fillText(name, labelX, labelY);
    });
  }


  // --- input: a tap places the next point, and it follows the finger until it lifts ---

  function pointerAt(event) {
    const rect = canvas.getBoundingClientRect();
    return [event.clientX - rect.left, event.clientY - rect.top];
  }

  canvas.addEventListener("pointerdown", event => {
    if (points.length === session.point_names.length) return;   // calibrate.py's on_mouse
    const [x, y] = pointerAt(event);
    points.push(clamp(x / scale, y / scale));
    dragging = true;
    canvas.setPointerCapture(event.pointerId);
    refresh();
  });

  // The one thing calibrate.py has no need of: a mouse click is a pixel, a
  // fingertip is ~10 px and covers the very seam it is aiming at.
  canvas.addEventListener("pointermove", event => {
    if (!dragging) return;
    const [x, y] = pointerAt(event);
    points[points.length - 1] = clamp(x / scale, y / scale);
    refresh();
  });

  canvas.addEventListener("pointerup", () => { dragging = false; });
  canvas.addEventListener("pointercancel", () => { dragging = false; });


  // --- the two buttons ---

  document.getElementById("newPhoto").addEventListener("click", showIntake);

  document.getElementById("undo").addEventListener("click", () => {
    points.pop();
    refresh();
  });

  // Whatever is placed so far: pressing early is calibrate.py's "press s early",
  // and validate() turns a top with no sleeve points into a sleeveless one.
  wear.addEventListener("click", async () => {
    const anchors = {};
    points.forEach((point, i) => { anchors[session.point_names[i]] = point; });
    const response = await fetch("/wear", {
      method: "POST", body: JSON.stringify(anchors)
    });
    statusLine.textContent = await response.text();
  });


  window.addEventListener("resize", () => { if (session && !stage.hidden) layout(); });
  load().catch(error => { statusLine.textContent = error.message; });
  </script>
</body>
</html>
